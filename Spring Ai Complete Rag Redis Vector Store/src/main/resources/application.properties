spring.application.name=SpringAi
spring.docker.compose.lifecycle-management=start_only
spring.threads.virtual.enabled=true
spring.ai.vectorstore.redis.uri=localhost
spring.ai.vectorstore.redis.port=6379
spring.ai.vectorstore.redis.index=spring-ai-redis-index
spring.ai.vectorstore.redis.prefix=spring-ai-redis-embedding:
spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=spring-ai-redis-index
spring.ai.vectorstore.observations.log-query-response=true



logging.level.org.springframework.ai.vectorstore=DEBUG
logging.level.org.springframework.ai.rag.advisor=DEBUG
logging.level.org.springframework.ai.rag.preretrieval.query.expansion=DEBUG
logging.level.com.example.springai.config=DEBUG
logging.level.org.springframework.ai.vectorstore.redis=DEBUG



spring.data.redis.jedis.pool.enabled=true
#spring.data.redis.url=jdbc:redis://localhost:6379/0
#spring.ai.vectorstore.redis.hnsw.ef-construction=





# The default Ollama Model in Spring Ai is mistral, but it can be changed by setting the below property. make sure to download the same model in entrypoint.sh file
spring.ai.ollama.chat.options.model=llama3.1:latest
spring.ai.ollama.embedding.model=llama3.1:latest
# If running the Ollama Docker Instance separately, then set this property to false
spring.docker.compose.enabled=true
spring.docker.compose.start.log-level=debug