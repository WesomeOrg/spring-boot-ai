services:
  ollama_service:
    image: ollama/ollama:latest
    container_name: ollama_container
    ports:
      - 11434:11434/tcp
    healthcheck:
      test: ollama --version || exit 1
    command: serve
    volumes:
      - ollama-volume:/root/.ollama
    pull_policy: missing
    tty: true
    restart: unless-stopped
    # entrypoint: [ "/usr/bin/bash", "/entrypoint.sh" ]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui_container
    environment:
      - OLLAMA_BASE_URL=http://ollama_service:11434
      - WEBUI_AUTH= false
    depends_on:
      - ollama-model
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-volume:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui-volume: { }
  ollama-volume: { }